[project]
name = "sre-mcp"
version = "0.1.0"
description = "MCP servers for SRE triage: ServiceNow, Datadog, Kibana/Elastic, GitLab"
requires-python = ">=3.11"
dependencies = ["mcp>=1.9,<2", "httpx>=0.27", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sre_mcp"]
